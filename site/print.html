<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Area Summary</title>
<meta name="description" content="A printable one-page summary of a station area or corridor from the Station Area Explorer demonstration.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/print.css">
</head>
<body class="print-page">
<nav class="toolbar no-print" aria-label="Page actions">
  <a href="explore/" id="back">Back to the explorer</a>
  <button type="button" id="print-btn">Print or save as PDF</button>
</nav>
<main>
<article class="sheet" id="sheet">
  <div class="demo-banner sheet-banner" role="note" aria-label="About this page">
    <strong class="pill">Demonstration</strong>
    <span>Prototype built by Jarvus Innovations for a proposal. Placeholder data from the U.S. Census Bureau. This is not the Metropolitan Council's product and not its displacement analysis.</span>
  </div>
  <header class="sheet-head">
    <div>
      <p class="kicker">Station Area Explorer · one-page summary</p>
      <h1 id="title">Loading…</h1>
      <p class="meta" id="subtitle"></p>
    </div>
  </header>
  <div class="sheet-grid">
    <figure class="sheet-map">
      <svg id="mini" viewBox="0 0 360 300" role="img" aria-label="Outline map"></svg>
      <figcaption id="map-cap"></figcaption>
    </figure>
    <section id="figs"></section>
  </div>
  <section id="sheet-story" class="sheet-story"></section>
  <footer class="sheet-foot" id="foot"></footer>
</article>
</main>
<script src="vendor/d3.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/print.js"></script>
</body>
</html>
